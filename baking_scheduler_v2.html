<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baking Scheduler</title>
<link rel="icon" type="image/png" href="icons/favicon-fire.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f9f8f6;color:#1a1a1a;padding:1.5rem}
h1{font-size:18px;font-weight:600;margin-bottom:.25rem;color:#7a4f30}

.top-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:.75rem;align-items:center}

/* Project bar */
.project-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:#f3e8d8;border:1px solid #e6d5bd;border-radius:12px;margin-bottom:14px}
.project-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;align-items:center}
.proj-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1.5px solid #d8b78c;background:#fff;color:#7a4f30;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s}
.proj-chip:hover{background:#fff8f0}
.proj-chip.active{background:#7a4f30;color:#fff;border-color:#7a4f30}
.proj-chip .pc-edit{font-size:10px;opacity:.65;padding:1px 3px;border-radius:3px}
.proj-chip .pc-edit:hover{opacity:1;background:rgba(255,255,255,.25)}
.proj-chip-empty{font-size:12px;color:#a8906f}
.btn-newproj{background:#7a4f30;color:#fff;border-color:#7a4f30;font-weight:600}
.btn-newproj:hover{background:#5f3d24}
.project-name-input{padding:5px 9px;border:1.5px solid #b8704a;border-radius:8px;font-size:12.5px;font-family:inherit;color:#7a4f30;background:#fff;font-weight:600;max-width:160px}
.project-name-input:focus{outline:none}
.np-form{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.project-date-input{padding:5px 8px;border:1.5px solid #b8704a;border-radius:8px;font-size:12px;font-family:inherit;color:#7a4f30;background:#fff;font-weight:500}
.project-date-input:focus{outline:none}
.np-create-btn{background:#5DCAA5;color:#fff;border-color:#4ab893;font-weight:600}
.np-create-btn:hover{background:#4ab893}
.np-cancel-btn{background:transparent;color:#888;border-color:#ddd}
.toggles{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.toggle-btn{padding:5px 11px;border-radius:20px;border:1.5px solid;font-size:12px;font-weight:500;cursor:pointer;background:transparent;transition:all .15s;color:#1a1a1a;display:inline-flex;align-items:center;gap:4px}
.toggle-btn.active{color:#fff}
.toggle-btn .edit-ico{font-size:11px;font-weight:700;opacity:.8;cursor:pointer;padding:1px 5px;margin-left:2px;border-radius:50%}
.toggle-btn .edit-ico:hover{opacity:1;background:rgba(255,255,255,.25)}
.toggle-btn .chip-edit{font-size:12px;margin-left:6px;opacity:1}
.action-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{padding:5px 12px;border-radius:20px;border:1px solid #ccc;font-size:12px;cursor:pointer;background:#fff;color:#444;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:#f0eeea}
.btn-proj{background:#b8704a;color:#fff;border-color:#b8704a;font-weight:600}
.btn-proj:hover{background:#a06040}
.btn-add{background:#5DCAA5;color:#fff;border-color:#4ab893}
.btn-add:hover{background:#4ab893}
.btn-total{border-color:#b8704a;color:#b8704a}
.btn-total:hover{background:#b8704a;color:#fff}
.btn-reset{background:transparent;color:#888;border-color:#ddd}

.hint{font-size:11px;color:#999;margin-bottom:10px}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:1rem}
.card{background:#f0eeea;border-radius:8px;padding:10px 12px}
.card-label{font-size:11px;color:#666;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.card-start{font-size:11px;color:#aaa;margin-bottom:2px}
.card-end{font-size:15px;font-weight:700;color:#7a4f30;margin-bottom:6px}
.card-dur{font-size:10px;color:#888;margin-bottom:6px}
.card-time-edit{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.card-time-edit input{padding:3px 6px;border:1px solid #d8c9a8;border-radius:6px;font-size:11px;font-family:inherit;color:#7a4f30;background:#fff;cursor:pointer}
.card-time-edit input:focus{outline:none;border-color:#b8704a}

/* Popups */
.total-popup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:200;min-width:260px}
.total-popup.show{display:block}
.total-popup h4{font-size:14px;color:#7a4f30;margin-bottom:12px}
.t-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #f0eeea}
.t-row:last-child{border-bottom:none;font-weight:600;padding-top:8px}
.popup-close{position:absolute;top:10px;right:12px;background:none;border:none;cursor:pointer;font-size:16px;color:#aaa}

/* View toggle */
.view-toggle{display:flex;gap:6px;margin-bottom:12px}
.view-btn{padding:5px 14px;border-radius:20px;border:1px solid #ddd;font-size:12px;cursor:pointer;background:#fff;color:#666;transition:all .15s;font-family:inherit}
.view-btn.active{background:#b8704a;color:#fff;border-color:#b8704a}

/* Timeline */
.tl-wrap{overflow-x:auto}
.tl-header{display:flex;margin-bottom:2px;position:sticky;top:0;z-index:10;background:#f9f8f6;padding-bottom:2px}
.tl-name-col{width:170px;min-width:170px;font-size:11px;color:#aaa;padding-bottom:4px}
.tl-hours{flex:1;display:flex;min-width:1400px;position:relative}
.tl-tick{flex:1;font-size:11px;color:#aaa;text-align:center;border-left:0.5px solid #e8e6e0;padding-bottom:4px;background:#f9f8f6}
.tl-tick.date-start{color:#8a7060;font-weight:600;font-size:10.5px}
.bread-row{margin-bottom:16px}
.row-inner{display:flex;align-items:center;min-width:1570px}
.name-col{width:170px;min-width:170px;font-size:11px;font-weight:500;display:flex;flex-direction:column;gap:2px}
.name-col-top{display:flex;align-items:center;gap:3px}
.name-col-inputs{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.name-col-inputs input[type=date],.name-col-inputs input[type=time]{padding:2px 4px;border:1px solid #e0d0b8;border-radius:5px;font-size:9.5px;font-family:inherit;color:#7a4f30;background:#fff8f2;cursor:pointer}
.name-col-inputs input[type=date]{max-width:95px}
.name-col-inputs input[type=time]{max-width:65px}
.name-col-inputs input:focus{outline:none;border-color:#b8704a;background:#fff}
.bar-area{flex:1;position:relative;height:36px}
.grid-line{position:absolute;top:0;height:100%;width:0.5px;background:#e8e6e0;pointer-events:none}
.grid-line.date-line{background:#c9b8a0;width:1px}
.seg{position:absolute;top:2px;height:32px;border-radius:4px;display:flex;align-items:center;overflow:visible;cursor:grab;user-select:none}
.seg:active{cursor:grabbing}
.seg.dragging{opacity:.85;z-index:10;cursor:grabbing}
.seg-inner{width:100%;height:100%;display:flex;align-items:center;overflow:hidden;border-radius:4px}
.seg span{font-size:10.5px;font-weight:500;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tooltip-box{position:absolute;background:#fff;border:0.5px solid #ccc;border-radius:8px;padding:8px 12px;font-size:11px;color:#1a1a1a;pointer-events:none;z-index:30;display:none;white-space:nowrap;bottom:38px;left:50%;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.tooltip-box.below{bottom:auto;top:38px}
.seg:hover .tooltip-box{display:block}

/* Project panel */
.proj-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:200;min-width:320px;max-width:480px;width:90%;max-height:75vh}
.proj-panel.show{display:flex;flex-direction:column}
.proj-panel h4{font-size:15px;font-weight:600;color:#7a4f30;margin-bottom:14px;flex-shrink:0}
.proj-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;min-height:0}
.proj-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:#f9f8f6;border:1px solid #eee;cursor:pointer;transition:all .15s;flex-shrink:0}
.proj-item:hover{background:#f0eeea}
.proj-item.active-proj{background:#fff5ee;border-color:#b8704a}
.proj-item .p-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.proj-item .p-name{flex:1;font-size:13px;font-weight:500}
.proj-item .p-check{font-size:14px;color:#b8704a}
.proj-panel-close{position:absolute;top:10px;right:12px;background:none;border:none;cursor:pointer;font-size:16px;color:#aaa}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#777}
.leg-sw{width:14px;height:9px;border-radius:2px}
.no-sel{text-align:center;padding:2rem;color:#bbb;font-size:13px}

/* Calendar */
.cal-wrap{background:#fff;border-radius:12px;border:1px solid #eee;overflow:hidden}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#faf8f5;border-bottom:1px solid #eee}
.cal-header h3{font-size:15px;font-weight:600;color:#7a4f30}
.cal-nav{background:transparent;border:1px solid #ddd;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px;color:#666}
.cal-nav:hover{background:#f0eeea}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid #f0f0f0}
.cal-dow{text-align:center;padding:8px 4px;font-size:11px;font-weight:600;color:#aaa;border-right:1px solid #f0f0f0;border-bottom:1px solid #f0f0f0;background:#faf8f5}
.cal-dow:first-child{color:#e06c75}
.cal-dow:last-child{color:#5b9bd5}
.cal-cell{min-height:80px;padding:4px;border-right:1px solid #f0f0f0;border-bottom:1px solid #f0f0f0;background:#fff}
.cal-cell:hover{background:#fdf9f5}
.cal-cell.other-month{background:#fafafa}
.cal-cell.today .cal-day{background:#b8704a;color:#fff;border-radius:50%}
.cal-day{font-size:12px;font-weight:500;color:#444;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.cal-cell.other-month .cal-day{color:#ccc}
.cal-event{font-size:10px;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:1px solid #f0f0f0;background:#faf8f5}
.cal-leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#777}
.cal-leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Backdrop */
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:150}
.backdrop.show{display:block}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:200}
.modal-back.show{display:flex}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:520px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.modal-box h3{font-size:15px;font-weight:600;margin-bottom:14px;color:#3a2a17}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:#888;margin-bottom:3px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:7px;font-size:13px;font-family:inherit;color:#1a1a1a;background:#fafafa}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#b8704a;background:#fff}
.field textarea{resize:vertical;line-height:1.6}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid #eee;flex-wrap:wrap}
.modal-actions .left{margin-right:auto}
.m-btn{padding:7px 14px;border-radius:20px;border:none;font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.m-btn-primary{background:#b8704a;color:#fff}
.m-btn-primary:hover{background:#a06040}
.m-btn-ghost{background:transparent;border:1px solid #ddd;color:#555}
.m-btn-ghost:hover{background:#f5f5f5}
.m-btn-danger{background:#fff;color:#d94040;border:1px solid #f0c0c0}
.m-btn-danger:hover{background:#fff0f0}

/* Stage list */
.stage-list{border:1px solid #eee;border-radius:8px;overflow:hidden;margin-top:6px;max-height:260px;overflow-y:auto}
.stage-item{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-bottom:1px solid #f0f0f0;font-size:12px;background:#fafafa}
.stage-item:last-child{border-bottom:none}
.stage-drag-handle{cursor:grab;color:#ccc;font-size:14px;padding:0 2px;user-select:none}
.stage-item.drag-over{background:#fff5ee;border-top:2px solid #b8704a}
.stage-item .s-name{flex:1;color:#333;font-weight:500}
.stage-item .s-dur{color:#888;min-width:60px;text-align:right;font-size:11px}
.stage-item .s-name{flex:0 0 auto;min-width:84px;max-width:40%}
.stage-item .s-note{flex:1;min-width:0;font-size:12px;color:#8a7a62;line-height:1.4;word-break:break-word;white-space:pre-line}
.stage-item .s-group{font-size:10px;padding:1px 6px;border-radius:10px;margin-left:4px;white-space:nowrap}
.stage-item .s-acts{display:flex;gap:3px;margin-left:4px}
.s-btn{background:transparent;border:none;cursor:pointer;font-size:12px;padding:2px 5px;border-radius:4px;color:#aaa}
.s-btn:hover{background:#eee;color:#555}
.add-stage-btn{width:100%;padding:7px;background:transparent;border:none;border-top:1px dashed #ddd;font-size:12px;color:#b8704a;cursor:pointer;font-family:inherit}
.add-stage-btn:hover{background:#fff5ee}

/* Duration */
.dur-split-wrap{display:flex;align-items:center;gap:6px}
.dur-split-wrap input{width:64px;text-align:center}
.dur-split-label{font-size:12px;color:#666;white-space:nowrap}

/* Color picker */
.color-options{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.color-opt{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-opt.selected{border-color:#333;transform:scale(1.15)}

/* Recipe */
.recipe-section{border:1px solid #eee;border-radius:8px;padding:10px;background:#fafafa;margin-top:4px}
.recipe-section textarea{width:100%;border:none;background:transparent;font-size:12.5px;font-family:inherit;color:#444;resize:vertical;min-height:70px;line-height:1.7;outline:none}
/* 프린트 */
#printArea{display:none}
#printArea .sp-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:16px}
#printArea .sp-head h1{font-size:20px;margin:0;font-weight:800}
#printArea .sp-date{font-size:12px;color:#555}
#printArea .sp-bread{margin-bottom:18px;page-break-inside:avoid}
#printArea .sp-bread-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
#printArea .sp-bread-name{font-size:15px;font-weight:800}
#printArea .sp-bread-time{font-size:11.5px;color:#555}
#printArea table{width:100%;border-collapse:collapse;font-size:12.5px}
#printArea th{text-align:left;padding:5px 8px;border-bottom:1.5px solid #333;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:#555}
#printArea td{padding:5px 8px;border-bottom:1px solid #ddd}
#printArea .sp-num{text-align:right;white-space:nowrap}
#printArea .sp-empty{font-size:13px;color:#888;padding:20px 0}
#printArea .sp-foot{margin-top:18px;font-size:11px;color:#888;border-top:1px solid #ddd;padding-top:8px}
@media print{
  html,body{background:#fff !important}
  body *{visibility:hidden !important}
  #printArea,#printArea *{visibility:visible !important}
  #printArea{display:block !important;position:absolute;left:0;top:0;width:100%;background:#fff !important}
  @page{margin:14mm}
}
  /* Pick Breads & Projects */
  .pick-tabs{display:flex;gap:6px;margin:4px 0 10px}
  .pick-tabs button{flex:1;border:1px solid #e3d3b5;background:#fff;color:#8a7253;border-radius:100px;padding:7px 10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .pick-tabs button.active{background:#7a5333;color:#fff;border-color:#7a5333}
  .pick-head{font-size:11px;color:#a8906f;font-weight:600;margin:2px 0 4px}
  .pick-sub{font-size:10.5px;color:#c0ab8c;margin:6px 2px 2px}
  .pick-sep{height:1px;background:#eee;margin:12px 0 8px}
  .pick-empty{font-size:11.5px;color:#aaa;padding:4px 2px 8px}
  .proj-item .p-plus{font-size:13px;color:#5DCAA5;font-weight:700}
  .proj-item .p-tag{font-size:10px;color:#a8906f;border:1px solid #e8d9bf;border-radius:8px;padding:0 5px}
  .proj-item .p-libdel,.proj-item .p-ren{font-size:13px;cursor:pointer;padding:0 2px 0 8px;opacity:.7}
  .proj-item.picked{background:#e9f6ef}
  .proj-item-proj .p-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .proj-item-proj .p-sub{font-size:10.5px;color:#a8906f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn-saveproj{background:#fff;border:1px solid #d8c4a0;color:#7a5333}
</style>
</head>
<body>

<h1>Baking Scheduler</h1>
<p style="font-size:13px;color:#8a7253;margin-bottom:1rem">오늘은 어떤 빵을 만들까요?</p>

<div class="top-row">
  <div class="toggles" id="toggles"></div>
  <div class="action-btns">
    <button class="btn btn-proj" id="projSelectorBtn">Pick Breads &amp; Projects</button>
    <button class="btn btn-saveproj" id="saveProjBtn">💾 프로젝트 저장</button>
  </div>
</div>

<p class="hint">바를 드래그하면 스케줄이 이동합니다. 카드 또는 타임라인의 날짜·시각을 직접 수정하면 즉시 반영됩니다.</p>

<div class="view-toggle">
  <button class="view-btn active" id="viewTimeline">📊 타임라인</button>
  <button class="view-btn" id="viewCalendar">📅 캘린더</button>
  <button class="view-btn" id="schedPrint">🖨 프린트</button>
</div>

<div class="cards" id="cards"></div>

<div id="timelineSection">
  <div class="tl-wrap">
    <div class="tl-header">
      <div class="tl-name-col"></div>
      <div class="tl-hours" id="hourTicks"></div>
    </div>
    <div id="tlBody"></div>
  </div>
  <div class="legend" id="legend"></div>
</div>

<div id="calView" style="display:none">
  <div class="cal-wrap">
    <div class="cal-header">
      <button class="cal-nav" id="calPrev">‹</button>
      <h3 id="calTitle"></h3>
      <button class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend" id="calLegend"></div>
  </div>
</div>

<!-- Project panel -->
<div class="backdrop" id="projBackdrop"></div>
<div class="proj-panel" id="projPanel">
  <button class="proj-panel-close" id="projPanelClose">✕</button>
  <h4>Pick Breads &amp; Projects</h4>
  <div class="pick-tabs" id="pickTabs"><button data-pick="bread" class="active">🍞 빵</button><button data-pick="project">📁 프로젝트</button></div>
  <div class="proj-list" id="projList"></div>
</div>

<!-- 프로젝트 저장 -->
<div class="modal-back" id="saveProjModal">
  <div class="modal-box" style="max-width:420px">
    <h3>💾 프로젝트 저장</h3>
    <div class="field"><label>프로젝트 이름</label><input type="text" id="spName" placeholder="예: 주말 캄빠뉴 + 식빵"></div>
    <div style="font-size:11.5px;color:#8a7253;margin:-2px 0 6px">담긴 빵: <span id="spList"></span></div>
    <div id="spHint" style="font-size:11.5px;color:#b8704a;min-height:16px"></div>
    <div class="modal-actions">
      <button class="m-btn m-btn-ghost" data-close="saveProjModal">취소</button>
      <button class="m-btn m-btn-primary" id="spSave">저장</button>
    </div>

// ===== BakerFlow V3.0: 서버 전용 데이터 저장 (localStorage 사용 안 함) =====
const LS = (function(){
  const API_BASE = '/api';
  const API_KEY = '02782f74015166e8372400dfe2b759979a22c92ab169b017549f6a0a70ca3d71';
  let cache = {};

  // 동기 부트스트랩: 이 아래의 앱 코드가 실행되기 전에 서버의 모든 데이터를 한 번에 가져옴
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', `${API_BASE}/bootstrap`, false);
    xhr.setRequestHeader('X-API-Key', API_KEY);
    xhr.send(null);
    if(xhr.status === 200) cache = JSON.parse(xhr.responseText);
  } catch(e){
    console.warn('[server] 스케줄러 초기 데이터 로드 실패 (서버 연결을 확인하세요):', e);
  }

  const pushTimers = {};
  function push(key){
    clearTimeout(pushTimers[key]);
    pushTimers[key] = setTimeout(() => {
      fetch(`${API_BASE}/data/${key}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
        body: JSON.stringify({ value: cache[key] })
      }).catch(e => console.warn(`[server] ${key} 저장 실패 (오프라인일 수 있음):`, e));
    }, 400);
  }

  return {
    get(k, f){ try { return (k in cache) ? JSON.parse(cache[k]) : f; } catch(e){ return f; } },
    set(k, v){ cache[k] = JSON.stringify(v); push(k); },
    remove(k){
      delete cache[k];
      clearTimeout(pushTimers[k]);
      fetch(`${API_BASE}/data/${k}`, { method: 'DELETE', headers: { 'X-API-Key': API_KEY } })
        .catch(e => console.warn(`[server] ${k} 삭제 실패:`, e));
    }
  };
})();

// 새 빵 기본 공정 (공정이 비어 있는 빵에 자동으로 채움, 시간은 수정 가능)
function defaultNewStages(){
  return [
    {id:uid(),n:'사전준비',m:30,g:'사전 준비',note:''},
    {id:uid(),n:'반죽',m:15,g:'반죽',note:''},
    {id:uid(),n:'1차발효',m:60,g:'발효',note:''},
    {id:uid(),n:'분할 및 성형',m:30,g:'성형',note:''},
    {id:uid(),n:'2차 발효',m:60,g:'발효',note:''},
    {id:uid(),n:'굽기',m:20,g:'굽기',note:''},
  ];
}
// LIBRARY = master bread catalog. Select Bread copies from here.
// Editing a project's bread never touches the library.
const LIBRARY=DEFAULT_BREADS;

// 사용자가 개별로 추가한 커스텀 빵 (어떤 프로젝트에도 속하지 않고, Select Bread 패널에서만 노출됨)
function getCustomBreads(){ return LS.get('sched.customBreads', []); }
function saveCustomBreads(arr){ LS.set('sched.customBreads', arr); }
// 라이브러리에서 삭제한 기본 빵 (기본 빵은 코드에 고정돼 있어 이름으로 숨김 처리)
function getRemovedDefaults(){ return LS.get('sched.removedDefaults', []); }
function getFullLibrary(){
  const removed=getRemovedDefaults();
  return [...DEFAULT_BREADS.filter(b=>!removed.includes(b.name)).map(b=>({...b,_default:true})), ...getCustomBreads()];
}
// 라이브러리에서 빵 삭제 (프로젝트에 이미 추가된 빵은 영향 없음)
function deleteLibraryBread(lib){
  if(lib._default){
    const removed=getRemovedDefaults();
    if(!removed.includes(lib.name)){ removed.push(lib.name); LS.set('sched.removedDefaults', removed); }
  } else {
    saveCustomBreads(getCustomBreads().filter(b=>b.id!==lib.id));
  }
}

// 외부(Calculator 등)에서 이름/메모만으로 커스텀 빵을 라이브러리에 추가
window.addLibraryBreadFromExternal = function(name, recipeNotes){
  const customBreads = getCustomBreads();
  const nb = { id: uid(), name: name, recipe: recipeNotes||'', category: libAutoCategory(name), color: COLORS[customBreads.length % COLORS.length], stages: defaultNewStages() };
  customBreads.push(nb);
  saveCustomBreads(customBreads);
  return nb;
};

// ===== 라이브러리 종류(섹션) — Calculator '내 레시피'와 같은 섹션·분류 규칙 =====
function libSections(){ const r=getSavedRecipes(); return {sections:r.sections, uncat:r.uncat}; }
function libAutoCategory(name){
  const n=String(name||'');
  if(/원시|피타|또르띠아|토르티야|(^|[\s(])난([\s(]|$)/.test(n)) return '플랫브레드';
  if(/식빵/.test(n)) return '식빵';
  if(/사워도우|르방/.test(n)) return '사워도우';
  if(/치아바타|캄파뉴|캄빠뉴|깜빠뉴|깜파뉴|바게트|포카치아|하드빵/.test(n)) return '하드·유럽빵';
  if(/소금빵|단과자|모닝빵|브리오슈/.test(n)) return '소프트·단과자';
  if(/스콘|비스코티|쿠키|머핀/.test(n)) return '구움과자';
  return libSections().uncat;
}
// 종류: 직접 정한 값 → 연결된 레시피의 섹션 → 이름으로 자동 분류
function libCategoryOf(l){
  const {sections}=libSections();
  if(l.category&&sections.includes(l.category)) return l.category;
  if(l.recipePresetId){ const r=(getSavedRecipes().list||[]).find(x=>x.id===l.recipePresetId); if(r&&sections.includes(r.category)) return r.category; }
  return libAutoCategory(l.name);
}
// 같은 섹션 안에서는 이름이 겹치는 빵끼리 모아서 정렬 (예: 사워도우 → 사워도우(새벽굽기) → 통밀사워도우(새벽굽기))
const libBase=n=>String(n||'').replace(/\(.*?\)/g,'').replace(/\s+/g,'');
function sortLibGroup(arr){
  const bases=arr.map(l=>libBase(l.name)).filter(Boolean);
  const fam=l=>{const b=libBase(l.name);return bases.filter(x=>b.includes(x)).sort((a,c)=>a.length-c.length)[0]||b;};
  return arr.map(l=>({l,f:fam(l),b:libBase(l.name)}))
    .sort((a,c)=>a.f.localeCompare(c.f,'ko')||a.b.length-c.b.length||a.b.localeCompare(c.b,'ko')||a.l.name.localeCompare(c.l.name,'ko'))
    .map(x=>x.l);
}
function findLibByName(name){ return getFullLibrary().find(b=>b.name===name)||null; }
// 빵 편집 → 📚 라이브러리에 저장. 같은 이름이 있으면 덮어쓰기, 없으면 새로 추가
function upsertCustomBreadToLibrary(data){
  const customBreads = getCustomBreads();
  const idx = customBreads.findIndex(b=>b.name===data.name);
  // 같은 이름의 기본 빵을 덮어쓰면: 기본 빵은 숨기고 커스텀으로 대체
  const def = DEFAULT_BREADS.find(b=>b.name===data.name);
  if(idx<0 && def){ const removed=getRemovedDefaults(); if(!removed.includes(def.name)){removed.push(def.name);LS.set('sched.removedDefaults',removed);} }
  const prev = idx>-1 ? customBreads[idx] : {};
  const libBread = {
    ...prev,
    id: idx>-1 ? prev.id : uid(),
    name: data.name,
    color: data.color,
    recipe: data.recipe||'',
    category: data.category||prev.category||'',
    stages: data.stages.map(s=>({...s, id:uid()})) // 라이브러리 전용 사본(새 id)
  };
  if(data.targetTime) libBread.targetTime=data.targetTime; else delete libBread.targetTime;
  if(idx>-1){ customBreads[idx]=libBread; } else { customBreads.push(libBread); }
  saveCustomBreads(customBreads);
}

// ===== 저장된 프로젝트(일정 묶음) + 작업판(board) =====
// projects: 💾 프로젝트 저장으로 남긴 일정 묶음 (Pick 창의 '프로젝트'에서 불러옴)
// board: 지금 화면에 보이는 작업판 하나 (빵·프로젝트를 골라 담고, 필요하면 프로젝트로 저장)
const _clone=o=>JSON.parse(JSON.stringify(o));
let projects=LS.get('sched.projects',null)||[];
let board=LS.get('sched.board',null);
if(!board){
  // 1회 이전: 예전 '활성 프로젝트'를 작업판으로 옮김. 기존 프로젝트들은 저장된 프로젝트로 그대로 남김
  const actId=LS.get('sched.activeProject',null);
  const src=projects.find(p=>p.id===actId)||projects[0];
  if(src){
    const sel=new Set(src.selected||[]);
    board={name:src.name||'',breads:_clone((src.breads||[]).filter(b=>!sel.size||sel.has(b.id))),groups:_clone(src.groups&&src.groups.length?src.groups:DEFAULT_GROUPS),selected:[]};
    board.selected=board.breads.map(b=>b.id);
  } else {
    const oldBreads=LS.get('sched.breads',null);
    board={name:'',breads:oldBreads?_clone(oldBreads):[],groups:_clone(LS.get('sched.groups',null)||DEFAULT_GROUPS),selected:[]};
    board.selected=board.breads.map(b=>b.id);
  }
  LS.set('sched.board',board);
}

// 빵이 하나도 없는 저장 프로젝트는 정리 (빈 프로젝트는 남기지 않음)
if(projects.some(p=>!(p.breads||[]).length)){ projects=projects.filter(p=>(p.breads||[]).length); LS.set('sched.projects',projects); }

// 공정이 비어 있는 기존 빵(라이브러리 + 프로젝트 + 작업판)에 기본 공정 채우기 — 빈 빵이 있을 때만 저장
(function fillEmptyStages(){
  const empty=b=>!b.stages||!b.stages.length;
  const cb=getCustomBreads();
  if(cb.some(empty)){ cb.forEach(b=>{ if(empty(b)) b.stages=defaultNewStages(); }); saveCustomBreads(cb); }
  let changed=false;
  projects.forEach(p=>(p.breads||[]).forEach(b=>{ if(empty(b)){ b.stages=defaultNewStages(); changed=true; } }));
  if(changed) LS.set('sched.projects',projects);
  if(board.breads.some(empty)){ board.breads.forEach(b=>{ if(empty(b)) b.stages=defaultNewStages(); }); LS.set('sched.board',board); }
})();
// 1회: 자동으로 채워진 기본 공정의 '반죽' 30분 → 15분 (기본값 변경 반영)
(function migrateDough15(){
  if(LS.get('sched.migDough15',false)) return;
  const fix=b=>{ let c=false; (b.stages||[]).forEach(st=>{ if(st.n==='반죽'&&st.g==='반죽'&&+st.m===30){ st.m=15; c=true; } }); return c; };
  const cb=getCustomBreads(); if(cb.map(fix).some(Boolean)) saveCustomBreads(cb);
  if(projects.map(p=>(p.breads||[]).map(fix).some(Boolean)).some(Boolean)) LS.set('sched.projects',projects);
  if(board.breads.map(fix).some(Boolean)) LS.set('sched.board',board);
  LS.set('sched.migDough15',true);
})();

// 작업판의 데이터는 예전과 같은 변수 이름(breads/groups/selected)으로 씀
function activeProject(){return board;}
let breads,groups,selected;
function loadActiveProject(){
  breads=(board.breads||[]).map(b=>({targetDate:getTodayStr(),targetTime:DEFAULT_TIME,...b}));
  groups=board.groups&&board.groups.length?board.groups:DEFAULT_GROUPS.map(g=>({...g}));

loadActiveProject();

// 작업판 현재 상태 저장 (빵이 다 빠지면 이름도 비움)
function saveActiveProject(){

// 예전 코드의 LS.set('sched.breads'/'sched.groups'/'sched.selected') → 작업판으로
const _origSet=LS.set;
LS.set=function(k,v){
  if(k==='sched.breads'){board.breads=v;if(!v.length)board.name='';return _origSet('sched.board',board);}
  if(k==='sched.groups'){board.groups=v;return _origSet('sched.board',board);}
  if(k==='sched.selected'){board.selected=v;return _origSet('sched.board',board);}
  return _origSet(k,v);
};

// ========================
// Core: unified time system
// All timing uses absolute minutes from epoch (local time)
// No separate offset — drag directly updates targetDate/targetTime
// ========================
function getGroupStyle(gName){
  const g=groups.find(x=>x.name===gName);
  return g?{bg:g.bg,fg:g.fg}:{bg:'#eee',fg:'#555'};
}

// Convert bread's targetDate+targetTime → absolute minutes
function breadEndMin(bread){
  const[th,tm]=(bread.targetTime||DEFAULT_TIME).split(':').map(Number);
  const d=new Date(bread.targetDate+'T'+String(th).padStart(2,'0')+':'+String(tm).padStart(2,'0')+':00');
  return Math.floor(d.getTime()/60000);
}

// Convert absolute minutes → {targetDate, targetTime}
function absMinToDateTime(absMin){
  const d=new Date(absMin*60000);
  const yr=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');
  const h=String(d.getHours()).padStart(2,'0'),mn=String(d.getMinutes()).padStart(2,'0');
  return {targetDate:`${yr}-${mo}-${dy}`,targetTime:`${h}:${mn}`};
}

function fmtDateTime(absMin){
  const d=new Date(absMin*60000);
  const mo=d.getMonth()+1,dy=d.getDate(),h=d.getHours(),mn=d.getMinutes();
  return `${mo}/${dy} `+(h<12?'오전':'오후')+' '+(h%12||12)+':'+String(mn).padStart(2,'0');
}
function fmtDur(m){
  if(m<60)return m+'분';
  const h=Math.floor(m/60),mn=m%60;
  return mn?h+'시간 '+mn+'분':h+'시간';
}

function computeTimings(bread){
  const endMin=breadEndMin(bread);
  const stages=bread.stages,n=stages.length,times=[];
  let cur=endMin;
  for(let i=n-1;i>=0;i--){
    times[i]={...stages[i],startMin:cur-stages[i].m,endMin:cur};
    cur-=stages[i].m;
  }
  return times;
}

// Update bread's targetDate/targetTime and save
function updateBreadTime(breadId,newEndMin){
  const dt=absMinToDateTime(newEndMin);
  breads=breads.map(b=>b.id===breadId?{...b,...dt}:b);
  LS.set('sched.breads',breads);
}

// Pick Breads & Projects 창 — 빵(라이브러리 → 내 레시피)과 저장된 프로젝트를 골라 작업판에 담기 (중복 허용)

// 레시피(계산기 '내 레시피') 목록 — 부모 페이지에서 최신 값을 읽고, 없으면 자체 캐시 사용
function getSavedRecipes(){
  try{ if(window.parent && window.parent!==window && typeof window.parent.getRecipesForScheduler==='function') return window.parent.getRecipesForScheduler(); }catch(e){}
  return {list:LS.get('baking.calcPresets',[])||[], sections:['사워도우','하드·유럽빵','플랫브레드','식빵','소프트·단과자','구움과자'], uncat:'미분류'};
}
let pickTab='bread';
function pickSectionHead(list,text){const hd=document.createElement('div');hd.className='pick-head';hd.textContent=text;list.appendChild(hd);}
function addBreadCopyToBoard(src){
  const nb={..._clone(src),id:uid(),targetDate:src.targetDate||(board.defaultDate||getTodayStr()),targetTime:src.targetTime||DEFAULT_TIME,
    stages:(src.stages&&src.stages.length)?src.stages.map(s=>({...s,id:uid()})):defaultNewStages()};
  delete nb._default;
  breads.push(nb);selected.add(nb.id);
  return nb;
}
function flashPicked(el){el.classList.add('picked');setTimeout(()=>el.classList.remove('picked'),600);}
// 빵 탭: 라이브러리(위) → 내 레시피(아래). 이미 라이브러리에 있는 레시피(연결됐거나 이름이 같은 것)는 레시피 목록에서 숨김
function renderPickBreads(list){
  const lib=getFullLibrary();
  pickSectionHead(list,`빵 라이브러리 (${lib.length})`);
  const {sections:libSecs,uncat:libUncat}=libSections();
  const libGroups={};lib.forEach(l=>{const c=libCategoryOf(l);(libGroups[c]=libGroups[c]||[]).push(l);});
  const libOrdered=[];
  [...libSecs,libUncat].filter(c=>libGroups[c]).forEach(c=>{libOrdered.push({head:c});sortLibGroup(libGroups[c]).forEach(l=>libOrdered.push(l));});
  libOrdered.forEach(l=>{
    if(l.head){const sh=document.createElement('div');sh.className='pick-sub';sh.textContent=l.head;list.appendChild(sh);return;}
    const libTime=l._default?null:(l.targetTime||null); // 저장된 완성 시각은 커스텀 빵만
    const el=document.createElement('div');el.className='proj-item';
    el.innerHTML=`<span class="p-dot" style="background:${l.color}"></span><span class="p-name"></span>${libTime?'<span class="p-tag p-time"></span>':''}${l.recipePresetId?'<span class="p-tag">레시피</span>':''}<span class="p-plus">＋</span><span class="p-libdel" title="라이브러리에서 삭제">🗑</span>`;
    if(libTime) el.querySelector('.p-time').textContent=`완성 ${libTime}`;
    el.querySelector('.p-name').textContent=l.name;
    el.addEventListener('click',e=>{
      if(e.target.classList.contains('p-libdel')){
        e.stopPropagation();
        if(confirm(`"${l.name}"을(를) 빵 라이브러리에서 삭제할까요?\n(이미 작업판·프로젝트에 담긴 빵은 그대로 남아요.${l.recipePresetId?'\n레시피는 다시 \'내 레시피에서 추가\' 목록에 나타나요.':''})`)){ deleteLibraryBread(l); renderProjPanel(); }
        return;
      }
      // 완성 시각이 저장된 빵: 오늘 그 시각이 이미 지났으면 내일로
      let tDate=null;
      if(libTime&&!board.defaultDate){const [hh,mm]=libTime.split(':').map(Number);const n=new Date();if(hh*60+mm<=n.getHours()*60+n.getMinutes()) tDate=getTomorrowStr();}
      addBreadCopyToBoard({...l,targetDate:tDate,targetTime:libTime});
      saveActiveProject();buildToggles();render();flashPicked(el);
    });
    list.appendChild(el);
  });
  const {list:recipes,sections,uncat}=getSavedRecipes();
  const libIds=new Set(lib.map(l=>l.recipePresetId).filter(Boolean));
  const libNames=new Set(lib.map(l=>l.name));
  const left=recipes.filter(r=>!libIds.has(r.id)&&!libNames.has(r.name));
  const sep=document.createElement('div');sep.className='pick-sep';list.appendChild(sep);
  pickSectionHead(list,`내 레시피에서 추가 (${left.length}) · 담으면 라이브러리로 옮겨져요`);
  if(!left.length){const e=document.createElement('div');e.className='pick-empty';e.textContent=recipes.length?'모든 레시피가 라이브러리에 있어요.':'저장된 레시피가 없어요. Calculator에서 💾 저장하면 여기에 나타나요.';list.appendChild(e);return;}
  const groups2={};left.forEach(r=>{const c=sections.includes(r.category)?r.category:uncat;(groups2[c]=groups2[c]||[]).push(r);});
  [...sections,uncat].filter(c=>groups2[c]).forEach(c=>{
    const sh=document.createElement('div');sh.className='pick-sub';sh.textContent=c;list.appendChild(sh);
    groups2[c].forEach(r=>{
      const el=document.createElement('div');el.className='proj-item';
      el.innerHTML=`<span class="p-dot" style="background:#e8d9bf"></span><span class="p-name"></span><span class="p-plus">＋</span>`;
      el.querySelector('.p-name').textContent=r.name;
      el.addEventListener('click',()=>{
        // 레시피 → 라이브러리에 저장(레시피와 연결) → 작업판에 사본 추가
        const cb=getCustomBreads();
        const libBread={id:uid(),name:r.name,color:COLORS[cb.length%COLORS.length],recipe:(r.data&&r.data.notes)||'',recipePresetId:r.id,category:c,stages:defaultNewStages()};
        cb.push(libBread);saveCustomBreads(cb);
        addBreadCopyToBoard(libBread);
        saveActiveProject();buildToggles();render();renderProjPanel();
      });
      list.appendChild(el);
    });
  });
}
// 프로젝트 탭: 저장된 프로젝트를 탭하면 그 안의 빵들을 작업판에 담음 (여러 개·중복 가능)
// 프로젝트 전체의 시작·완성 시각(분)
function projSpan(p){
  let start=Infinity,end=-Infinity;
  (p.breads||[]).forEach(b=>{
    const e=breadEndMin({targetDate:b.targetDate||getTodayStr(),targetTime:b.targetTime||DEFAULT_TIME});
    const total=(b.stages||[]).reduce((t,s)=>t+(+s.m||0),0);
    start=Math.min(start,e-total);end=Math.max(end,e);
  });
  return isFinite(start)?{start,end}:null;
}
// 저장된 날짜가 이미 지났으면 '지금부터 시작할 수 있는 가장 빠른 날'로 옮길 일수 (시각·빵 사이 간격은 그대로)
function projShiftDays(p){
  const sp=projSpan(p);if(!sp) return 0;
  const now=Math.floor(Date.now()/60000);
  return sp.start>=now?0:Math.ceil((now-sp.start)/1440);
}
function fmtProjWhen(p){
  const sp=projSpan(p);if(!sp) return '';
  const hm=m=>{const d=new Date(m*60000);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
  const now=Math.floor(Date.now()/60000);
  if(sp.start>=now){ const d=new Date(sp.end*60000); return `${d.getMonth()+1}/${d.getDate()} ${hm(sp.end)} 완성`; }
  const day=m=>{const d=new Date(m*60000);d.setHours(0,0,0,0);return d.getTime();};
  const gap=Math.round((day(sp.end)-day(sp.start))/86400000);
  return `${hm(sp.start)} 시작 → ${gap===0?'':gap===1?'다음 날 ':gap+'일 뒤 '}${hm(sp.end)} 완성`;
}
function renderPickProjects(list){
  pickSectionHead(list,`저장된 프로젝트 (${projects.length}) · 탭하면 작업판에 담겨요`);

    el.querySelector('.p-sub').textContent=[(p.breads||[]).map(b=>b.name).join(', '),fmtProjWhen(p)].filter(Boolean).join(' · ');
    el.addEventListener('click',e=>{

        if(v&&v!==p.name){p.name=v;LS.set('sched.projects',projects);renderProjPanel();}

      const wasEmpty=!breads.length;

      saveActiveProject();buildToggles();render();flashPicked(el);
    });
    list.appendChild(el);
  });
}

    const editIco=document.createElement('span');editIco.className='edit-ico chip-edit';editIco.textContent='✏️';editIco.title='공정 보기/수정';
    btn.appendChild(nameSpan);btn.appendChild(editIco);btn.appendChild(delIco);

      breads=breads.filter(x=>x.id!==b.id);selected.delete(b.id);
      saveActiveProject();buildToggles();render();
    });
    cont.appendChild(btn);
  });
}

function render(){
  const active=breads.filter(b=>selected.has(b.id));
  const allTimes=active.map(b=>computeTimings(b));
  let gMin=Infinity,gMax=-Infinity;
  allTimes.forEach(times=>times.forEach(t=>{if(t.startMin<gMin)gMin=t.startMin;if(t.endMin>gMax)gMax=t.endMin;}));
  if(!active.length){const now=Math.floor(Date.now()/60000);gMin=now;gMax=now+24*60;}
  const span=gMax-gMin;
  const startH=Math.floor(gMin/60),endH=Math.ceil(gMax/60),numTicks=endH-startH+1;

  // Hour ticks — use local timezone offset to align ticks with local time
  const tzOffsetMin=new Date().getTimezoneOffset(); // e.g. -540 for KST
  const ticks=document.getElementById('hourTicks');ticks.innerHTML='';
  for(let h=startH;h<=endH;h++){
    const el=document.createElement('div');el.className='tl-tick';
    // Convert absolute hour to local time
    const localMin=h*60-tzOffsetMin;
    const localH=((Math.floor(localMin/60))%24+24)%24;
    const isNewDay=localH===0&&h!==startH;
    if(isNewDay){
      el.classList.add('date-start');
      const d=new Date(h*3600000);
      el.textContent=(d.getMonth()+1)+'/'+(d.getDate())+'('+['일','월','화','수','목','금','토'][d.getDay()]+') 0시';
    } else {el.textContent=localH+'시';}
    ticks.appendChild(el);
  }

  // Summary cards with inline date/time inputs
  const cardsEl=document.getElementById('cards');cardsEl.innerHTML='';
  active.forEach((b)=>{
    const times=computeTimings(b);
    if(!times.length){
      const card=document.createElement('div');card.className='card';
      card.innerHTML=`
        <div class="card-label"><span class="dot" style="background:${b.color}"></span>${b.name}</div>
        <div class="card-start" style="color:#c9a">⚠️ 공정 단계가 없어요</div>
        <div class="card-end" style="font-size:11px;color:#aaa">✏️ 눌러서 단계를 추가해주세요</div>`;
      card.addEventListener('click',()=>openBreadModal(b.id));
      cardsEl.appendChild(card);
      return;
    }
    const st=times[0].startMin,en=times[times.length-1].endMin;
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`
      <div class="card-label"><span class="dot" style="background:${b.color}"></span>${b.name}</div>
      <div class="card-start">시작: ${fmtDateTime(st)}</div>
      <div class="card-end">완료: ${fmtDateTime(en)}</div>
      <div class="card-dur">${fmtDur(en-st)}</div>
      <div class="card-time-edit">
        <input type="date" value="${b.targetDate}" data-bid="${b.id}" class="ci-date">
        <input type="time" value="${b.targetTime}" data-bid="${b.id}" class="ci-time">
      </div>`;
    card.querySelector('.ci-date').addEventListener('change',e=>{
      const b2=breads.find(x=>x.id===e.target.dataset.bid);
      if(b2){breads=breads.map(x=>x.id===b2.id?{...x,targetDate:e.target.value}:x);LS.set('sched.breads',breads);render();}
    });
    card.querySelector('.ci-time').addEventListener('change',e=>{
      const b2=breads.find(x=>x.id===e.target.dataset.bid);
      if(b2){breads=breads.map(x=>x.id===b2.id?{...x,targetTime:e.target.value}:x);LS.set('sched.breads',breads);render();}
    });
    cardsEl.appendChild(card);
  });

  // Timeline rows
  const body=document.getElementById('tlBody');body.innerHTML='';
  if(!active.length){body.innerHTML='<div class="no-sel">프로젝트를 선택해 주세요</div>';return;}

  active.forEach((bread,rowIdx)=>{
    const times=computeTimings(bread);
    const row=document.createElement('div');row.className='bread-row';
    const inner=document.createElement('div');inner.className='row-inner';

    // Name col with inline inputs (always in sync with bread data)
    const nameCol=document.createElement('div');nameCol.className='name-col';nameCol.style.color=bread.color;
    const nameTop=document.createElement('div');nameTop.className='name-col-top';
    const nameText=document.createElement('span');nameText.textContent=bread.name;
    nameTop.appendChild(nameText); // 수정(✏️)은 위쪽 빵 칩으로 옮김

    const inputRow=document.createElement('div');inputRow.className='name-col-inputs';
    const dateIn=document.createElement('input');dateIn.type='date';dateIn.value=bread.targetDate;
    const timeIn=document.createElement('input');timeIn.type='time';timeIn.value=bread.targetTime;

    dateIn.addEventListener('change',()=>{
      breads=breads.map(b=>b.id===bread.id?{...b,targetDate:dateIn.value}:b);
      LS.set('sched.breads',breads);render();
    });
    timeIn.addEventListener('change',()=>{
      breads=breads.map(b=>b.id===bread.id?{...b,targetTime:timeIn.value}:b);
      LS.set('sched.breads',breads);render();
    });

    inputRow.appendChild(dateIn);inputRow.appendChild(timeIn);
    nameCol.appendChild(nameTop);nameCol.appendChild(inputRow);
    inner.appendChild(nameCol);

    const barArea=document.createElement('div');barArea.className='bar-area';barArea.style.minWidth='1400px';

    for(let gi=0;gi<=numTicks;gi++){
      const d=new Date((startH+gi)*3600000);
      const gl=document.createElement('div');
      gl.className='grid-line'+(d.getHours()===0&&gi>0?' date-line':'');
      gl.style.left=(gi/numTicks*100)+'%';barArea.appendChild(gl);
    }

    times.forEach(t=>{
      const lp=((t.startMin-gMin)/span)*100;
      const wp=(t.m/span)*100;
      const gc=getGroupStyle(t.g);
      const seg=document.createElement('div');seg.className='seg';
      seg.style.cssText=`left:${lp}%;width:${wp}%;`;
      const inner2=document.createElement('div');inner2.className='seg-inner';
      inner2.style.cssText=`background:${gc.bg};color:${gc.fg};border:0.5px solid ${gc.fg}55;`;
      const sp=document.createElement('span');sp.textContent=t.n;inner2.appendChild(sp);
      const tip=document.createElement('div');tip.className='tooltip-box'+(rowIdx===0?' below':'');
      tip.innerHTML=`<strong>${t.n}</strong><br><span style="color:#888;font-size:10px">${fmtDateTime(t.startMin)} → ${fmtDateTime(t.endMin)}</span><br><span style="color:#aaa">${fmtDur(t.m)}${t.note?' · '+t.note:''}</span>`;
      seg.appendChild(inner2);seg.appendChild(tip);

      // ★ 핵심: drag directly updates targetDate/targetTime (no separate offset)
      let dragStartX=null,dragStartEndMin=null;
      seg.addEventListener('mousedown',e=>{
        if(e.button!==0)return;e.preventDefault();
        dragStartX=e.clientX;
        dragStartEndMin=breadEndMin(bread); // capture current end min
        seg.classList.add('dragging');
        const onMove=ev=>{
          const barW=barArea.getBoundingClientRect().width||1400;
          const deltaMin=Math.round((ev.clientX-dragStartX)/(barW/span)/5)*5;
          const newEndMin=dragStartEndMin+deltaMin;
          // Update bread in memory (no save yet — save on mouseup)
          breads=breads.map(b=>b.id===bread.id?{...b,...absMinToDateTime(newEndMin)}:b);
          render();
        };
        const onUp=()=>{
          seg.classList.remove('dragging');
          // Save final position
          LS.set('sched.breads',breads);
          document.removeEventListener('mousemove',onMove);
          document.removeEventListener('mouseup',onUp);
        };
        document.addEventListener('mousemove',onMove);
        document.addEventListener('mouseup',onUp);
      });
      seg.addEventListener('touchstart',e=>{
        e.preventDefault();dragStartX=e.touches[0].clientX;
        dragStartEndMin=breadEndMin(bread);
        const onMove=ev=>{
          const barW=barArea.getBoundingClientRect().width||1400;
          const deltaMin=Math.round((ev.touches[0].clientX-dragStartX)/(barW/span)/5)*5;
          const newEndMin=dragStartEndMin+deltaMin;
          breads=breads.map(b=>b.id===bread.id?{...b,...absMinToDateTime(newEndMin)}:b);
          render();
        };
        const onUp=()=>{LS.set('sched.breads',breads);document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onUp);};
        document.addEventListener('touchmove',onMove,{passive:false});
        document.addEventListener('touchend',onUp);
      },{passive:false});

      barArea.appendChild(seg);
    });
    inner.appendChild(barArea);row.appendChild(inner);body.appendChild(row);
  });

  document.getElementById('legend').innerHTML=groups.map(g=>
    `<div class="leg-item"><div class="leg-sw" style="background:${g.bg};border:0.5px solid ${g.fg}44"></div>${g.name}</div>`
  ).join('');
  LS.set('sched.selected',[...selected]);
  if(document.getElementById('calView').style.display!=='none')renderCalendar();
}

// ========================
// View toggle & Calendar
// ========================
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth();
document.getElementById('viewTimeline').addEventListener('click',()=>{
  document.getElementById('viewTimeline').classList.add('active');document.getElementById('viewCalendar').classList.remove('active');
  document.getElementById('timelineSection').style.display='';document.getElementById('calView').style.display='none';
});
document.getElementById('viewCalendar').addEventListener('click',()=>{
  document.getElementById('viewCalendar').classList.add('active');document.getElementById('viewTimeline').classList.remove('active');
  document.getElementById('timelineSection').style.display='none';document.getElementById('calView').style.display='block';
  const active=breads.filter(b=>selected.has(b.id));
  if(active.length){const d=new Date(active[0].targetDate+'T00:00:00');calYear=d.getFullYear();calMonth=d.getMonth();}
  renderCalendar();
});
document.getElementById('calPrev').addEventListener('click',()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();});
document.getElementById('calNext').addEventListener('click',()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();});

function renderCalendar(){
  const monthNames=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent=calYear+'년 '+monthNames[calMonth];
  const grid=document.getElementById('calGrid');grid.innerHTML='';
  ['일','월','화','수','목','금','토'].forEach(d=>{const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.appendChild(el);});
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  const today=new Date();
  const events=getCalendarEvents();
  const totalCells=Math.ceil((firstDay+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    const cell=document.createElement('div');cell.className='cal-cell';
    let day,isOther=false,y2=calYear,m2=calMonth;
    if(i<firstDay){day=daysInPrev-firstDay+i+1;isOther=true;m2=calMonth-1;if(m2<0){m2=11;y2--;}}
    else if(i-firstDay>=daysInMonth){day=i-firstDay-daysInMonth+1;isOther=true;m2=calMonth+1;if(m2>11){m2=0;y2++;}}
    else{day=i-firstDay+1;}
    if(isOther)cell.classList.add('other-month');
    if(!isOther&&day===today.getDate()&&calMonth===today.getMonth()&&calYear===today.getFullYear())cell.classList.add('today');
    const dayEl=document.createElement('div');dayEl.className='cal-day';dayEl.textContent=day;cell.appendChild(dayEl);
    const dateStr=y2+'-'+String(m2+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const dayEvents=events.filter(e=>e.date===dateStr).sort((a,b)=>a.sortKey-b.sortKey);
    let expanded=false;
    const eventContainer=document.createElement('div');
    function renderEvents(){
      eventContainer.innerHTML='';
      const toShow=expanded?dayEvents:dayEvents.slice(0,3);
      toShow.forEach(ev=>{
        const evEl=document.createElement('div');evEl.className='cal-event';
        evEl.style.cssText=`background:${ev.color}22;color:${ev.color};border-left:2px solid ${ev.color};`;
        evEl.textContent=ev.label;evEl.title=ev.fullLabel;eventContainer.appendChild(evEl);
      });
      if(dayEvents.length>3){
        const more=document.createElement('div');
        more.style.cssText='font-size:9px;color:#b8704a;padding:1px 4px;cursor:pointer;font-weight:500;';
        more.textContent=expanded?'▲ 접기':('+'+(dayEvents.length-3)+'개 더 보기');
        more.addEventListener('click',e=>{e.stopPropagation();expanded=!expanded;renderEvents();});
        eventContainer.appendChild(more);
      }
    }
    renderEvents();
    cell.appendChild(eventContainer);
    if(dayEvents.length>3){
      dayEl.style.cursor='pointer';
      dayEl.addEventListener('click',e=>{e.stopPropagation();expanded=!expanded;renderEvents();});
    }
    grid.appendChild(cell);
  }
  const legEl=document.getElementById('calLegend');legEl.innerHTML='';
  breads.filter(b=>selected.has(b.id)).forEach(b=>{
    const el=document.createElement('div');el.className='cal-leg-item';
    el.innerHTML=`<span class="cal-leg-dot" style="background:${b.color}"></span>${b.name}`;legEl.appendChild(el);
  });
}
function getCalendarEvents(){
  const events=[];
  breads.filter(b=>selected.has(b.id)).forEach(b=>{
    computeTimings(b).forEach(t=>{
      const startD=new Date(t.startMin*60000),endD=new Date(t.endMin*60000);
      let cur=new Date(startD);cur.setHours(0,0,0,0);
      while(cur<=endD){
        const ds=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
        const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
        const isStartDay=cur.toDateString()===startD.toDateString();
        // 시작한 날: '17:20 오토리즈' / 이어지는 날: '~10:30 2차 냉장 발효'(끝나는 시각)
        const label=(isStartDay?hm(startD):'~'+(cur.toDateString()===endD.toDateString()?hm(endD):'24:00'))+' '+t.n;
        const sortKey=isStartDay?(startD.getHours()*60+startD.getMinutes()):-1;
        events.push({date:ds,label,sortKey,fullLabel:b.name+' · '+t.n+' '+hm(startD)+'~'+hm(endD)+' ('+fmtDur(t.m)+')',color:b.color});
        cur.setDate(cur.getDate()+1);
      }
    });
  });
  return events;
}

// ========================
// 프린트 (텍스트 일정표)
// ========================
function _esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function buildSchedulePrint(){
  const active=breads.filter(b=>selected.has(b.id));
  const proj=board.name?{name:board.name}:null;
  const d=new Date();
  const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let body='';
  if(!active.length){
    body='<div class="sp-empty">작업판에 빵이 없습니다. Pick Breads &amp; Projects에서 담아 주세요.</div>';
  } else {
    const list=active.map(b=>({b,times:computeTimings(b)})).sort((x,y)=>(x.times[0]?.startMin??Infinity)-(y.times[0]?.startMin??Infinity));
    list.forEach(({b,times})=>{
      if(!times.length) return; // 공정 단계가 없는 빵은 이 요약 목록에서 제외
      const st=times[0].startMin, en=times[times.length-1].endMin;
      let rows='';
      times.forEach(t=>{
        rows+=`<tr><td>${_esc(t.n)}</td><td>${_esc(t.g)}</td><td class="sp-num">${fmtDateTime(t.startMin)}</td><td class="sp-num">${fmtDateTime(t.endMin)}</td><td class="sp-num">${fmtDur(t.m)}</td></tr>`;
      });
      body+=`<div class="sp-bread">
        <div class="sp-bread-head"><span class="sp-bread-name">${_esc(b.name)}</span><span class="sp-bread-time">${fmtDateTime(st)} → ${fmtDateTime(en)} · 총 ${fmtDur(en-st)}</span></div>
        <table><thead><tr><th>공정</th><th>그룹</th><th class="sp-num">시작</th><th class="sp-num">완료</th><th class="sp-num">소요</th></tr></thead><tbody>${rows}</tbody></table>
      </div>`;
    });
  }
  document.getElementById('printArea').innerHTML=`
    <div class="sp-head"><h1>🥖 ${_esc(proj?proj.name:'베이킹 일정')}</h1><span class="sp-date">${ds}</span></div>
    ${body}
    <div class="sp-foot">Ayo's Baking · 베이킹 스케줄</div>`;
}
document.getElementById('schedPrint').addEventListener('click',()=>{ buildSchedulePrint(); window.print(); });
